<!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA8QRhbrJsIQPoCZ4_n24mGOBjG-MusjDI",
            authDomain: "keuangan-nikah.firebaseapp.com",
            databaseURL: "https://keuangan-nikah-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "keuangan-nikah",
            storageBucket: "keuangan-nikah.firebasestorage.app",
            messagingSenderId: "602194908980",
            appId: "1:602194908980:web:b15d2e3fa711db187b761",
            measurementId: "G-KLEGJBCFY6"
        };

        const app = initializeApp(firebaseConfig);
        // Mengarahkan database secara spesifik ke URL Singapore
        const db = getDatabase(app, "https://keuangan-nikah-default-rtdb.asia-southeast1.firebasedatabase.app");

        let currentUser = 'pria'; 
        let appData = {
            pria: { expenses: {} },
            wanita: { expenses: {} },
            tabunganBersamaHistory: {}
        };

        const JATAH_MAKAN_BULANAN = 1500000;

        // Listener Realtime dari Firebase
        const dbRef = ref(db, 'keuangan_nikah_data');
        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                appData = {
                    pria: { expenses: data.pria?.expenses || {} },
                    wanita: { expenses: data.wanita?.expenses || {} },
                    tabunganBersamaHistory: data.tabunganBersamaHistory || {}
                };
            } else {
                appData = { pria: { expenses: {} }, wanita: { expenses: {} }, tabunganBersamaHistory: {} };
            }
            updateUI();
        });

        window.switchUser = function(user) {
            currentUser = user;
            const btnPria = document.getElementById('btn-pria');
            const btnWanita = document.getElementById('btn-wanita');
            const badge = document.getElementById('active-user-badge');
            const title = document.getElementById('active-user-title');
            const submitBtn = document.getElementById('submit-btn');

            if(user === 'pria') {
                btnPria.className = "px-4 py-1.5 rounded-xl text-xs font-bold transition-all shadow-sm bg-rose-600 text-white";
                btnWanita.className = "px-4 py-1.5 rounded-xl text-xs font-bold transition-all text-slate-600 hover:bg-slate-200";
                badge.innerText = "Dompet Firdaus";
                title.innerText = "Halo, Firdaus Almubin!";
                submitBtn.className = "w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl text-sm transition-all shadow-md shadow-rose-200";
            } else {
                btnWanita.className = "px-4 py-1.5 rounded-xl text-xs font-bold transition-all shadow-sm bg-pink-600 text-white";
                btnPria.className = "px-4 py-1.5 rounded-xl text-xs font-bold transition-all text-slate-600 hover:bg-slate-200";
                badge.innerText = "Dompet Viranti";
                title.innerText = "Halo, Viranti!";
                submitBtn.className = "w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-xl text-sm transition-all shadow-md shadow-pink-200";
            }
            updateUI();
        }

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);
        }

        window.formatRupiahInput = function(input) {
            let value = input.value.replace(/[^,\d]/g, '').toString();
            let split = value.split(',');
            let sisa = split[0].length % 3;
            let rupiah = split[0].substr(0, sisa);
            let ribuan = split[0].substr(sisa).match(/\d{3}/gi);
            if (ribuan) {
                let separator = sisa ? '.' : '';
                rupiah += separator + ribuan.join('.');
            }
            input.value = rupiah;
        }

        function parseRupiah(str) {
            return parseInt(str.replace(/[^0-9]/g, '')) || 0;
        }

        window.addExpense = function(e) {
            e.preventDefault();
            const amountStr = document.getElementById('amount').value;
            const desc = document.getElementById('description').value;
            const amount = parseRupiah(amountStr);

            if(amount <= 0) return;

            const newTxRef = push(ref(db, `keuangan_nikah_data/${currentUser}/expenses`));
            set(newTxRef, {
                date: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }),
                desc: desc,
                amount: amount,
                timestamp: Date.now()
            });

            document.getElementById('amount').value = '';
            document.getElementById('description').value = '';
        }

        window.deleteExpense = function(user, id) {
            if(user !== currentUser) {
                alert("Kamu hanya bisa menghapus data milikmu sendiri demi privasi & kontrol masing-masing!");
                return;
            }
            remove(ref(db, `keuangan_nikah_data/${user}/expenses/${id}`));
        }

        window.tambahTabunganModal = function() {
            document.getElementById('modal-tabungan').classList.remove('hidden');
            document.getElementById('modal-tabungan').classList.add('flex');
        }

        window.closeTabunganModal = function() {
            document.getElementById('modal-tabungan').classList.remove('flex');
            document.getElementById('modal-tabungan').classList.add('hidden');
        }

        window.submitTabungan = function(e) {
            e.preventDefault();
            const amountStr = document.getElementById('tabungan-amount').value;
            const amount = parseRupiah(amountStr);
            if(amount <= 0) return;

            const newTabunganRef = push(ref(db, 'keuangan_nikah_data/tabunganBersamaHistory'));
            set(newTabunganRef, {
                date: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
                user: currentUser,
                amount: amount,
                timestamp: Date.now()
            });

            closeTabunganModal();
            document.getElementById('tabungan-amount').value = '';
        }

        window.deleteTabungan = function(id) {
            remove(ref(db, `keuangan_nikah_data/tabunganBersamaHistory/${id}`));
        }

        window.resetData = function() {
            if(confirm("Yakin ingin mereset seluruh data catatan bersama di cloud?")) {
                set(ref(db, 'keuangan_nikah_data'), null);
            }
        }

        function updateUI() {
            const priaExpensesObj = appData.pria.expenses || {};
            const wanitaExpensesObj = appData.wanita.expenses || {};
            const tabunganObj = appData.tabunganBersamaHistory || {};

            const totalKeluarPria = Object.values(priaExpensesObj).reduce((sum, item) => sum + item.amount, 0);
            const totalKeluarWanita = Object.values(wanitaExpensesObj).reduce((sum, item) => sum + item.amount, 0);

            const sisaPria = JATAH_MAKAN_BULANAN - totalKeluarPria;
            const sisaWanita = JATAH_MAKAN_BULANAN - totalKeluarWanita;

            if(currentUser === 'pria') {
                document.getElementById('sisa-makan-display').innerText = formatRupiah(sisaPria);
            } else {
                document.getElementById('sisa-makan-display').innerText = formatRupiah(sisaWanita);
            }

            const tabunganArr = Object.entries(tabunganObj).map(([id, val]) => ({ id, ...val }));
            const totalTabungan = tabunganArr.reduce((sum, item) => sum + item.amount, 0);
            document.getElementById('total-tabungan-bersama').innerText = formatRupiah(totalTabungan);

            let percent = (totalTabungan / 50000000) * 100;
            if(percent > 100) percent = 100;
            document.getElementById('progress-bar').style.width = percent + '%';

            updateMilestoneStatus(5000000, 'ms-5', totalTabungan);
            updateMilestoneStatus(10000000, 'ms-10', totalTabungan);
            updateMilestoneStatus(20000000, 'ms-20', totalTabungan);
            updateMilestoneStatus(30000000, 'ms-30', totalTabungan);
            updateMilestoneStatus(50000000, 'ms-50', totalTabungan);

            // Render Tabungan History
            const tabunganTbody = document.getElementById('tabungan-history-list');
            tabunganTbody.innerHTML = '';

            if(tabunganArr.length === 0) {
                tabunganTbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-slate-400 text-xs">Belum ada riwayat setoran tabungan.</td></tr>`;
            } else {
                tabunganArr.sort((a,b) => b.timestamp - a.timestamp).forEach(item => {
                    let penyetorBadge = item.user === 'pria' ? '<span class="bg-rose-100 text-rose-700 text-[10px] font-bold px-2 py-0.5 rounded-full">🤵 Firdaus</span>' : '<span class="bg-pink-100 text-pink-700 text-[10px] font-bold px-2 py-0.5 rounded-full">👰 Viranti</span>';
                    
                    let tr = document.createElement('tr');
                    tr.className = "border-b border-slate-50 hover:bg-slate-50/50 transition-all text-xs";
                    tr.innerHTML = `
                        <td class="py-2.5 text-slate-500">${item.date}</td>
                        <td class="py-2.5">${penyetorBadge}</td>
                        <td class="py-2.5 text-right font-bold text-emerald-600">+ ${formatRupiah(item.amount)}</td>
                        <td class="py-2.5 text-center">
                            <button onclick="deleteTabungan('${item.id}')" class="text-slate-400 hover:text-rose-600 font-bold px-1.5 py-0.5">✕</button>
                        </td>
                    `;
                    tabunganTbody.appendChild(tr);
                });
            }

            // Render Transaksi Makan
            const priaArr = Object.entries(priaExpensesObj).map(([id, val]) => ({ id, owner: 'Firdaus', userKey: 'pria', ...val }));
            const wanitaArr = Object.entries(wanitaExpensesObj).map(([id, val]) => ({ id, owner: 'Viranti', userKey: 'wanita', ...val }));
            const allTx = [...priaArr, ...wanitaArr].sort((a,b) => b.timestamp - a.timestamp);

            const tbody = document.getElementById('transaction-list');
            tbody.innerHTML = '';

            if(allTx.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-400 text-xs">Belum ada pengeluaran makan yang dicatat.</td></tr>`;
                return;
            }

            allTx.forEach(tx => {
                let badgeOwner = tx.owner === 'Firdaus' ? '<span class="bg-rose-100 text-rose-700 text-[10px] font-bold px-2 py-0.5 rounded-full">🤵 Firdaus</span>' : '<span class="bg-pink-100 text-pink-700 text-[10px] font-bold px-2 py-0.5 rounded-full">👰 Viranti</span>';
                let canDelete = tx.userKey === currentUser;

                let tr = document.createElement('tr');
                tr.className = "border-b border-slate-50 hover:bg-slate-50/50 transition-all text-xs";
                tr.innerHTML = `
                    <td class="py-3 text-slate-500">${tx.date}</td>
                    <td class="py-3">${badgeOwner}</td>
                    <td class="py-3 font-medium text-slate-700">${tx.desc}</td>
                    <td class="py-3 text-right font-bold text-rose-600">- ${formatRupiah(tx.amount)}</td>
                    <td class="py-3 text-center">
                        ${canDelete ? `<button onclick="deleteExpense('${tx.userKey}', '${tx.id}')" class="text-slate-400 hover:text-rose-600 font-bold px-1.5 py-0.5">✕</button>` : `<span class="text-slate-300 text-[10px] italic">Terkunci</span>`}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateMilestoneStatus(targetVal, elementId, currentVal) {
            const el = document.getElementById(elementId);
            const badge = el.querySelector('.status-badge');
            if(currentVal >= targetVal) {
                el.className = "border rounded-2xl p-3 text-center transition-all bg-emerald-50 border-emerald-300 shadow-sm";
                badge.className = "status-badge text-[10px] font-bold mt-2 inline-block px-2 py-0.5 rounded bg-emerald-600 text-white";
                badge.innerText = "Tercapai! ✨";
            } else {
                el.className = "border rounded-2xl p-3 text-center transition-all bg-slate-50 border-slate-200";
                badge.className = "status-badge text-[10px] font-bold mt-2 inline-block px-2 py-0.5 rounded bg-slate-200 text-slate-600";
                badge.innerText = "Belum Tercapai";
            }
        }
    </script>
